<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldAir Chat</title>
<style>
body{font-family:sans-serif;background:#eaf6ff;margin:0}
header{background:linear-gradient(to right,#00b894,#0984e3);color:white;padding:25px;text-align:center}
.container{max-width:500px;margin:15px auto;padding:10px}
.search-box{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:12px;border-radius:10px;border:1px solid #ccc}
button{padding:12px 18px;background:#0984e3;color:white;border:none;border-radius:10px;cursor:pointer}
.card{background:white;padding:18px;border-radius:15px;margin-top:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
#chatBox{height:180px;overflow-y:auto;background:#f8f9fa;padding:10px;border-radius:10px;margin:10px 0}
.msg{padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🌍 WorldAir Chat</h1>
<p>Global AQI & Weather Platform</p>
</header>

<div class="container">
<div class="search-box">
<input id="cityInput" placeholder="Lahore likho...">
<button onclick="searchCity()">Search</button>
</div>

<div class="card">
<h2 id="cityName">Karachi</h2>
<h3 id="temp">35.9°C</h3>
<p id="desc">Live Weather - Wind: 12.4 km/h</p>
<div id="aqiBox" style="background:#ffeaa7;padding:12px;border-radius:10px;font-weight:bold">AQI: 56 - Moderate</div>
<p id="advice">💡 Mask pehno, air moderate hai</p>
</div>

<div class="card">
<h3>💬 Community Chat - Live</h3>
<div id="chatBox">
<div class="msg"><b>Ali:</b> Lahore me AQI 180 hai</div>
<div class="msg"><b>Sara:</b> Karachi me aj hawa theek hai</div>
</div>
<div class="search-box">
<input id="chatInput" placeholder="Apna message likho...">
<button onclick="sendChat()">Send</button>
</
