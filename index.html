<!DOCTYPE html>
<html>
<head>
<title>WorldAir Chat</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header>
<h1>🌍 WorldAir Chat</h1>
<p>Global AQI & Weather Platform</p>
</header>
<div class="container">
<div class="search-box">
<input type="text" id="cityInput" placeholder="Enter city e.g. Faisalabad">
<button onclick="getWeather()">Search</button>
</div>
<div id="weatherCard" class="card">
<h2 id="cityName">Faisalabad</h2>
<h3 id="temp">28°C</h3>
<p id="desc">Hazy Sunshine</p>
<div id="aqiBox">AQI: 156 - Moderate</div>
<p>💡 Mask pehno, air moderate hai</p>
</div>
<div class="card">
<h3>💬 Community Chat</h3>
<div>Ali: Lahore me AQI 180 hai</div>
<br>
<input type="text" placeholder="Your message">
<button>Send</button>
</div>
</div>
</body>
</html>
