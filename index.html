<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldAir Chat</title>
<style>
body{font-family:Arial;background:#eaf6ff;margin:0}
header{background:linear-gradient(to right,#00b894,#0984e3);color:white;padding:25px;text-align:center}
.container{max-width:500px;margin:15px auto;padding:10px}
input{width:70%;padding:12px;border-radius:10px;border:1px solid #ccc}
button{padding:12px 18px;background:#0984e3;color:white;border:none;border-radius:10px;cursor:pointer}
.card{background:white;padding:18px;border-radius:15px;margin-top:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
</style>
</head>
<body>
<header>
<h1>🌍 WorldAir Chat</h1>
<p>Global AQI & Weather Platform</p>
</header>

<div class="container">
<input id="cityInput" placeholder="Lahore likho...">
<button onclick="searchCity()">Search</button>

<div class="card">
<h2 id="cityName">Karachi</h2>
<h3 id="temp">35.9°C</h3>
<p id="desc">Live Weather - Wind: 12.4 km/h</p>
<div id="aqiBox" style="background:#ffeaa7;padding:12px;border-radius:10px;font-weight:bold">AQI: 56 - Moderate</div>
<p id="advice">💡 Mask pehno, air moderate hai</p>
</div>
</div>

<script>
async function searchCity(){
let city=document.getElementById('cityInput').value;
if(!city){city='Lahore';}
document.getElementById('cityName').innerText=city+' Loading...';
try{
let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+city+'&count=1');
let gd=await g.json();
if(!gd.results){alert('City not found');return;}
let lat=gd.results[0].latitude;
let lon=gd.results[0].longitude;
let name=gd.results[0].name;
let w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true');
let wd=await w.json();
let a=await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon+'&current=us_aqi');
let ad=await a.json();
document.getElementById('cityName').innerText=name;
document.getElementById('temp').innerText=wd.current_weather.temperature+'°C';
document.getElementById('desc').innerText='Live Weather - Wind: '+wd.current_weather.windspeed+' km/h';
let aqi=ad.current.us_aqi;
let box=document.getElementById('aqiBox');
let advice=document.getElementById('advice');
if(aqi<=50){box.style.background='#55efc4';box.innerText='AQI: '+aqi+' - Good';advice.innerText='💡 Hawa saaf hai';}
else if(aqi<=100){box.style.background='#ffeaa7';box.innerText='AQI: '+aqi+' - Moderate';advice.innerText='💡 Mask pehno';}
else{box.style.background='#ff7675';box.innerText='AQI: '+aqi+' - Unhealthy';advice.innerText='😷 Ghar me raho';}
}catch(e){alert(e.message);}
}
</script>
</body>
</html>
